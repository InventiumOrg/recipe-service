version: "2"
sql:
  - engine: "postgresql"
    queries: "./models/query"
    schema: "./models/migration"
    gen:
      go:
        package: "models"
        out: "models/sqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"